<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ParaChrSNP software workflow</title>
  <desc id="desc">A publication-style modular workflow diagram for ParaChrSNP, from paired-end reads and reference genome to chromosome-wise SNP calling, filtering, optional downstream modules and integrated HTML report.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fa}
      .panel{fill:#fff;stroke:#d7dee8;stroke-width:1.4}
      .card{fill:#fff;stroke:#31445b;stroke-width:1.4}
      .blue{fill:#eaf2fb;stroke:#2f6fb2}
      .green{fill:#e9f4ef;stroke:#2f7d5b}
      .gold{fill:#fff4dc;stroke:#b17813}
      .purple{fill:#f0edf8;stroke:#7462a8}
      .red{fill:#fdeeee;stroke:#b45656}
      .gray{fill:#f2f4f7;stroke:#687587}
      .dark{fill:#1f2d3d;stroke:#1f2d3d}
      .title{font:700 34px Arial,Helvetica,sans-serif;fill:#1d2b3a}
      .subtitle{font:400 18px Arial,Helvetica,sans-serif;fill:#5a6775}
      .stage{font:700 15px Arial,Helvetica,sans-serif;fill:#536070;letter-spacing:.08em}
      .label{font:700 16px Arial,Helvetica,sans-serif;fill:#26364a}
      .small{font:400 13px Arial,Helvetica,sans-serif;fill:#526171}
      .tiny{font:400 12px Arial,Helvetica,sans-serif;fill:#647385}
      .white{fill:#fff}
      .arrow{stroke:#66788f;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#97a4b3;stroke-width:1.8;fill:none;marker-end:url(#arrow-soft)}
      .dash{stroke-dasharray:7 6}
      .chrom{fill:#fff;stroke:#2f6fb2;stroke-width:2}
      .dna{stroke:#2f7d5b;stroke-width:2.1;fill:none}
      .snp{fill:#d95f02}
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#66788f"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#97a4b3"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="70" y="70">ParaChrSNP</text>
  <text class="subtitle" x="70" y="103">Containerized chromosome-wise SNP calling workflow for GWAS and population-genomic analyses</text>

  <rect class="panel" x="60" y="145" width="1480" height="640" rx="10"/>

  <g id="stage-inputs">
    <rect class="card blue" x="95" y="205" width="190" height="420" rx="8"/>
    <text class="stage" x="122" y="240">INPUTS</text>
    <rect class="card blue" x="122" y="275" width="136" height="64" rx="7"/>
    <text class="label" x="148" y="302">Raw FASTQ</text>
    <text class="small" x="148" y="324">paired-end reads</text>
    <path class="dna" d="M224 286 C237 297,237 316,224 327 M244 286 C231 297,231 316,244 327"/>
    <circle class="snp" cx="234" cy="307" r="4"/>
    <rect class="card green" x="122" y="385" width="136" height="64" rx="7"/>
    <text class="label" x="151" y="412">Reference</text>
    <text class="small" x="151" y="434">FASTA, GFF</text>
    <rect class="card gray" x="122" y="495" width="136" height="64" rx="7"/>
    <text class="label" x="155" y="522">Config</text>
    <text class="small" x="155" y="544">samples, params</text>
  </g>

  <g id="stage-prep">
    <rect class="card gray" x="340" y="205" width="210" height="420" rx="8"/>
    <text class="stage" x="375" y="240">PREPARATION</text>
    <rect class="card gray" x="370" y="275" width="150" height="58" rx="7"/>
    <text class="label" x="407" y="300">Precheck</text>
    <text class="small" x="407" y="321">environment audit</text>
    <rect class="card gray" x="370" y="360" width="150" height="58" rx="7"/>
    <text class="label" x="414" y="385">RastQC</text>
    <text class="small" x="414" y="406">raw-read QC</text>
    <rect class="card blue" x="370" y="445" width="150" height="58" rx="7"/>
    <text class="label" x="405" y="470">fastp</text>
    <text class="small" x="405" y="491">clean reads</text>
    <rect class="card green" x="370" y="530" width="150" height="58" rx="7"/>
    <text class="label" x="396" y="555">Reference</text>
    <text class="small" x="396" y="576">bwa, fai, dict</text>
  </g>

  <g id="stage-alignment">
    <rect class="card blue" x="605" y="205" width="210" height="420" rx="8"/>
    <text class="stage" x="638" y="240">ALIGNMENT</text>
    <rect class="card blue" x="635" y="310" width="150" height="64" rx="7"/>
    <text class="label" x="675" y="337">bwa-mem2</text>
    <text class="small" x="675" y="359">read mapping</text>
    <rect class="card blue" x="635" y="455" width="150" height="64" rx="7"/>
    <text class="label" x="674" y="482">BAM QC</text>
    <text class="small" x="674" y="504">sort, index, rmdup</text>
    <path class="soft" d="M710 374 V455"/>
  </g>

  <g id="stage-calling">
    <rect class="card gold" x="870" y="205" width="280" height="420" rx="8"/>
    <text class="stage" x="932" y="236">CHROMOSOME-WISE</text>
    <text class="stage" x="960" y="258">SNP CALLING</text>
    <rect class="card gold" x="900" y="285" width="220" height="92" rx="7"/>
    <text class="label" x="937" y="313">HaplotypeCaller</text>
    <text class="small" x="937" y="336">sample x chromosome GVCFs</text>
    <path class="chrom" d="M940 363 C928 348,928 329,940 314 C952 329,952 348,940 363"/>
    <path class="chrom" d="M985 363 C973 348,973 329,985 314 C997 329,997 348,985 363"/>
    <path class="chrom" d="M1030 363 C1018 348,1018 329,1030 314 C1042 329,1042 348,1030 363"/>
    <rect class="card gold" x="900" y="410" width="220" height="74" rx="7"/>
    <text class="label" x="962" y="437">GenomicsDB</text>
    <text class="small" x="962" y="459">per-chromosome import</text>
    <rect class="card gold" x="900" y="515" width="220" height="74" rx="7"/>
    <text class="label" x="965" y="542">GatherVcfs</text>
    <text class="small" x="965" y="564">combined cohort VCF</text>
    <path class="soft" d="M1010 377 V410"/>
    <path class="soft" d="M1010 484 V515"/>
  </g>

  <g id="stage-refine">
    <rect class="card purple" x="1205" y="205" width="250" height="210" rx="8"/>
    <text class="stage" x="1242" y="240">VARIANT REFINEMENT</text>
    <rect class="card purple" x="1235" y="275" width="190" height="54" rx="7"/>
    <text class="label" x="1282" y="299">SelectVariants</text>
    <text class="small" x="1282" y="319">SNP and INDEL split</text>
    <rect class="card purple" x="1235" y="350" width="190" height="54" rx="7"/>
    <text class="label" x="1290" y="374">Hard filters</text>
    <text class="small" x="1290" y="394">configurable thresholds</text>
  </g>

  <g id="stage-modules">
    <rect class="card green" x="1205" y="455" width="250" height="170" rx="8"/>
    <text class="stage" x="1241" y="490">DOWNSTREAM MODULES</text>
    <text class="small" x="1234" y="525">Missingness · PLINK/HapMap</text>
    <text class="small" x="1234" y="551">Beagle imputation · PCA</text>
    <text class="small" x="1234" y="577">Distance tree · SnpEff</text>
    <text class="small" x="1234" y="603">CNVnator CNV detection</text>
  </g>

  <g id="report">
    <rect class="card dark" x="535" y="675" width="540" height="78" rx="8"/>
    <text class="white" x="600" y="704" style="font:700 18px Arial,Helvetica,sans-serif">Integrated HTML report</text>
    <text class="white" x="600" y="730" style="font:400 14px Arial,Helvetica,sans-serif">QC summaries, filtered variants, CNV tables, PCA, tree, annotation</text>
    <text class="white" x="600" y="748" style="font:400 14px Arial,Helvetica,sans-serif">and publication-ready figures</text>
  </g>

  <path class="arrow" d="M285 415 H340"/>
  <path class="arrow" d="M550 415 H605"/>
  <path class="arrow" d="M815 415 H870"/>
  <path class="arrow" d="M1150 415 H1205"/>
  <path class="arrow" d="M1330 415 V455"/>
  <path class="soft dash" d="M710 519 C710 620,750 650,805 675"/>
  <path class="soft dash" d="M1330 625 C1330 675,1160 710,1075 710"/>

  <rect x="80" y="808" width="1440" height="1.2" fill="#d7dee8"/>
  <text class="tiny" x="80" y="834">Distinctive feature: ParaChrSNP performs GVCF generation and joint genotyping by chromosome, reducing the cohort-level bottleneck while retaining a portable Snakemake + Singularity execution model.</text>
</svg>
