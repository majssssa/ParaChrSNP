reference: "Camellia_sinensis.genome.fasta"

container:
    image: "ParaChrSNP_sandbox"

samples:
    sample1: "raw_fastq/sample1"
    sample2: "raw_fastq/sample2"
    sample3: "raw_fastq/sample3"
    sample4: "raw_fastq/sample4"
    sample5: "raw_fastq/sample5"
    sample6: "raw_fastq/sample6"
    sample7: "raw_fastq/sample7"
    sample8: "raw_fastq/sample8"
    sample9: "raw_fastq/sample9"
    sample10: "raw_fastq/sample10"
chromosomes:
  - NC_138961.1
  - NC_138962.1
  - NC_138963.1
  - NC_138964.1
  - NC_138965.1
  - NC_138966.1
  - NC_138967.1
  - NC_138968.1
  - NC_138969.1
  - NC_138970.1
  - NC_138971.1
  - NC_138972.1
  - NC_138973.1
  - NC_138974.1
  - NC_138975.1
params:
    qc:
        threads: 4
        extra: "--nozip"

    aligner:
        name: "minibwa"
        executable: "minibwa"
        map_threads: 4
        sort_threads: 2
        index_threads: 4
        index_extra: ""
        map_extra: ""

    fastp:
        fastp_threads: 4

    haplotype_caller:
        threads: 4
        native_pair_hmm_threads: 4
        java_options: "--java-options \"-Xms512m -Xmx4g\""

    mark_duplicates:
        threads: 4
        java_options: "--java-options \"-Xmx10g\""

    genotype_gvcfs:
        java_options: "--java-options \"-Xms512m -Xmx128g\""

    combine_vcf:
        threads: 4
        java_options: "--java-options \"-Xms512m -Xmx128g\""

    joint_calling:
        method: "genomicsdb"
        reader_threads: 16
        genotype_threads: 1
        gather_threads: 1
        batch_size: 50
        import_java_options: "--java-options \"-Xms1g -Xmx16g\""
        genotype_java_options: "--java-options \"-Xms512m -Xmx128g\""
        gather_java_options: "--java-options \"-Xms512m -Xmx128g\""
        extra_import: ""
        extra_genotype: ""

    snp_filter:
        filter_name: "SNP_filter"
        thresholds:
            qd: 2.0
            mq: 40.0
            fs: 60.0
            sor: 3.0
            mq_rank_sum: -12.5
            read_pos_rank_sum: -8.0

    indel_filter:
        filter_name: "INDEL_filter"
        thresholds:
            qd: 2.0
            fs: 200.0
            sor: 10.0
            mq_rank_sum: -12.5
            read_pos_rank_sum: -8.0

    vcf_missing:
        output_prefix: "missing/combined.snp.filtered"
        plot_prefix: "missing/combined.snp.filtered.miss_check"
        plot_script: "scripts/plink-missing-nature_1.R"
        threads: 4
        extra: "--allow-extra-chr"

    vcf_convert:
        input_vcf: "result_vcfs/combined.snp.filtered.vcf.gz"
        output_prefix: "format_convert/combined.snp.filtered"
        plink_extra: "--allow-extra-chr"
        plink_threads: 4
        tassel_executable: "run_pipeline.pl"
        tassel_memory: "-Xmx10g"
        tassel_threads: 16
        tassel_extra: ""

    imputation:
        enabled: false
        input_vcf: "result_vcfs/combined.snp.filtered.vcf.gz"
        output_prefix: "imputation/combined.snp.filtered.beagle"
        jar: ""
        java_options: "-Xmx4g"
        threads: 4
        extra: ""

    cnv:
        enabled: false
        software: "cnvnator"
        executable: "cnvnator"
        vcf_converter: "cnvnator2VCF.pl"
        bin_size: 100
        reference_dir: "reference"
        extra: ""

    pi:
        enabled: false
        input_vcf: "result_vcfs/combined.snp.filtered.vcf.gz"
        pop_info: ""
        output_dir: "pi"
        window_size: 100000
        window_step: 10000
        extra: ""

    snp_density:
        enabled: false
        input_vcf: "result_vcfs/combined.snp.filtered.vcf.gz"
        output_dir: "snp_density"
        window_size: 1000000

    admixture:
        enabled: false
        input_prefix: "format_convert/combined.snp.filtered"
        output_dir: "admixture"
        executable: "admixture"
        k_min: 1
        k_max: 10
        cv: 10
        threads: 4
        prune_window: 50
        prune_step: 10
        prune_r2: 0.2
        geno: 0.999
        pop_info: ""
        show_sample_names: true
        plink_extra: "--allow-extra-chr"
        normalize_extra: "--allow-extra-chr --set-missing-var-ids @:#"
        admixture_plink_extra: "--allow-extra-chr 0"
        extra: ""

    ld_decay:
        enabled: false
        input_vcf: "result_vcfs/combined.snp.filtered.vcf.gz"
        pop_info: ""
        output_dir: "ld_decay"
        executable: "PopLDdecay"
        max_dist: 300
        threads: 1
        extra: ""

    vcf2pca:
        enabled: false
        executable: "VCF2PCACluster"
        sample_group: ""
        output_prefix: "pca/ParaChrSNP"
        threads: 4
        extra: ""

    vcf2dis:
        enabled: false
        executable: "VCF2Dis"
        sample_group: ""
        output_matrix: "dis/ParaChrSNP.p_dis.mat"
        output_tree: "dis/ParaChrSNP.p_dis.nwk"
        tree_method: 1
        extra: ""

    snpeff:
        enabled: false
        annotate_snp: true
        annotate_indel: false
        executable: "snpEff"
        genome_name: "custom_genome"
        data_dir: "annotation/snpeff_data"
        config_file: "annotation/snpeff.config"
        genome_fasta: "reference/Arabidopsis_thaliana.fasta"
        annotation_file: "reference/Arabidopsis_thaliana.gff"
        annotation_format: "gff3"
        output_prefix: "annotation/combined"
        database_done: "annotation/snpeff_db.done"
        java_options: "-Xmx32g"
        threads: 1
        extra: ""
